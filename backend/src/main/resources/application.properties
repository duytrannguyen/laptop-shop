# =====================================================
# CẤU HÌNH ỨNG DỤNG TECHSHOP BACKEND
# =====================================================
# Tất cả giá trị có thể ghi đè qua biến môi trường (Environment Variables)
# Cú pháp: ${TEN_BIEN:gia_tri_mac_dinh}
# =====================================================

spring.application.name=techshop-backend
debug=false
spring.main.lazy-initialization=true
spring.jmx.enabled=false

# --- LOGGING ---
# Chỉ hiển thị log mức INFO trở lên (bỏ bớt log thừa)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO

# --- SERVER ---
# Port mặc định 8080, ghi đè qua biến môi trường PORT (dùng khi deploy)
server.port=${PORT:8080}
server.tomcat.threads.max=50
server.tomcat.max-connections=1000
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# --- DATABASE (MySQL) ---
# URL kết nối MySQL. Thay đổi DB_URL, DB_USERNAME, DB_PASSWORD khi deploy lên server thật.
# createDatabaseIfNotExist=true → tự tạo database nếu chưa có
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techshop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dongduy122}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# --- JPA / HIBERNATE ---
# update: Tự động cập nhật schema khi chạy (thêm cột mới, tạo bảng mới)
# KHÔNG dùng 'create' hay 'create-drop' trên môi trường production (mất data)
spring.jpa.hibernate.ddl-auto=update
# Tắt log SQL query (bật lên khi debug)
spring.jpa.show-sql=false
# Tắt OSIV pattern để tránh N+1 query không kiểm soát
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Tắt auto-config UserDetailsService của Spring Security (dùng hệ thống token riêng)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- FILE UPLOAD ---
# Cho phép upload file tối đa 15MB (mỗi file và toàn request)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# =====================================================
# CẤU HÌNH RIÊNG CỦA ỨNG DỤNG
# =====================================================

# Tài khoản admin mặc định (BẮT BUỘC thay đổi trước khi đưa lên production)
app.admin.email=${ADMIN_EMAIL:admin@techshop.vn}
app.admin.password=${ADMIN_PASSWORD:123456}

# Token bảo mật
# secret: Khóa bí mật ký token (BẮT BUỘC thay đổi trước khi đưa lên production)
# ttl-seconds: Thời hạn token = 43200 giây = 12 giờ
app.token.secret=${TOKEN_SECRET:change-this-secret-before-production}
app.token.ttl-seconds=${TOKEN_TTL_SECONDS:43200}

# CORS: Các domain frontend được phép gọi API
# Thêm domain production vào đây khi deploy (phân cách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Thư mục lưu ảnh upload (đường dẫn tương đối hoặc tuyệt đối)
app.upload-dir=${UPLOAD_DIR:./uploads}
