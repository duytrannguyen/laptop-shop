spring.application.name=techshop-backend
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/laptop_shop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dongduy122}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
# spring.h2.console.settings.web-allow-others=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

app.admin.email=${ADMIN_EMAIL:admin@techshop.vn}
app.admin.password=${ADMIN_PASSWORD:123456}
app.token.secret=${TOKEN_SECRET:change-this-secret-before-production}
app.token.ttl-seconds=${TOKEN_TTL_SECONDS:43200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.upload-dir=${UPLOAD_DIR:./uploads}
